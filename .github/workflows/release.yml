name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.55)
        required: true
        type: string
      ref:
        description: Commit SHA, branch, or tag to build and release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve and validate release target
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
    - name: Validate tag and resolve commit
      id: target
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        release_sha=$(git rev-parse HEAD)
        git tag -- "$RELEASE_TAG" "$release_sha"
        echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
    - name: Summary
      env:
        TAG: ${{ inputs.tag }}
        REF: ${{ steps.target.outputs.sha }}
        REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      shell: bash
      run: |
        echo "Tag: ${TAG}" >> "${GITHUB_STEP_SUMMARY}"
        echo "Ref: ${REF} (${REPOSITORY_URL}/commit/${REF})" >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Check and build release
    needs: prepare
    uses: ./.github/workflows/main.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  release:
    name: Upload Release Assets
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: Generate GitHub App token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ vars.CLIENT_ID }}
        private-key: ${{ secrets.PRIVATE_KEY }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        ref: ${{ needs.prepare.outputs.sha }}
        fetch-depth: 0
    - name: Download Linux x86 tarball
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: platform-tools-linux-x86_64.tar.bz2
    - name: Download Linux ARM tarball
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: platform-tools-linux-aarch64.tar.bz2
    - name: Download macOS ARM tarball
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: platform-tools-osx-aarch64.tar.bz2
    - name: Download Windows tarball
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: platform-tools-windows-x86_64.tar.bz2
    - name: Ship one set of sbpf libraries in every tarball
      # Each runner compiles the sbpf*-solana-solana Rust libraries and the newlib
      # C libraries itself. The machine code comes out the same, but the files
      # don't (crate hashes, build paths, codegen-unit grouping), so a program
      # built with the macOS tarball never byte-matches the same program built
      # with the Linux one. Use the Linux x86 copies everywhere; each tarball
      # keeps its own host compiler. Windows ships no newlib, so it only gets
      # the Rust libraries.
      shell: bash
      run: |
        set -euo pipefail
        mkdir ref
        tar -xjf platform-tools-linux-x86_64.tar.bz2 -C ref --wildcards \
          './rust/lib/rustlib/sbpf*-solana-solana' './llvm/lib/lib[cm].a' './llvm/lib/sbpf*/lib[cm].a'
        for t in platform-tools-linux-aarch64 platform-tools-osx-aarch64 platform-tools-windows-x86_64; do
          mkdir "$t"
          tar -xjf "$t.tar.bz2" -C "$t"
          for d in ref/rust/lib/rustlib/sbpf*-solana-solana; do
            rm -rf "$t/rust/lib/rustlib/$(basename "$d")"
            cp -R "$d" "$t/rust/lib/rustlib/"
          done
          (cd ref/llvm/lib && find . -name 'lib[cm].a') | while read -r f; do
            if [ -f "$t/llvm/lib/$f" ]; then cp "ref/llvm/lib/$f" "$t/llvm/lib/$f"; fi
          done
          tar -C "$t" -jcf "$t.tar.bz2" .
          rm -rf "$t"
        done
        rm -rf ref
    - name: Create and push release tag
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      shell: bash
      run: |
        git tag -- "$RELEASE_TAG" "$RELEASE_SHA"
        git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        token: ${{ steps.app-token.outputs.token }}
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ needs.prepare.outputs.sha }}
        name: Release ${{ inputs.tag }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          platform-tools-linux-x86_64.tar.bz2
          platform-tools-linux-aarch64.tar.bz2
          platform-tools-osx-aarch64.tar.bz2
          platform-tools-windows-x86_64.tar.bz2
